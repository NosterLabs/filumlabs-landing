<style>
  :root {
    --bg: #0d1115;
    --fog-a: #4d6576;
    --fog-b: #26333d;
    --ink: #eef2f5;
    --muted: rgba(238, 242, 245, .58);
    --glass: rgba(255, 255, 255, .07);
    --glass-hi: rgba(255, 255, 255, .16);
    --edge: rgba(255, 255, 255, .16);
    --shadow: rgba(0, 0, 0, .38);
  }
  :root[data-theme="light"] {
    --bg: #e6eaee;
    --fog-a: #b9c7d2;
    --fog-b: #f6f7f8;
    --ink: #11161b;
    --muted: rgba(17, 22, 27, .6);
    --glass: rgba(255, 255, 255, .38);
    --glass-hi: rgba(255, 255, 255, .7);
    --edge: rgba(255, 255, 255, .75);
    --shadow: rgba(40, 55, 70, .16);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Urbanist', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .5s, color .5s;
  }
  /* fog behind the glass, so backdrop-filter has something to bend */
  .fog { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .fog i { position: absolute; border-radius: 50%; filter: blur(90px); }
  .fog i:nth-child(1) { width: 70vw; height: 70vw; left: -15vw; top: -25vw; background: var(--fog-a); opacity: .55; }
  .fog i:nth-child(2) { width: 40vw; height: 60vw; left: 38vw; top: 20vh; background: #000; opacity: .45; }
  .fog i:nth-child(3) { width: 50vw; height: 50vw; right: -20vw; bottom: -20vw; background: var(--fog-b); opacity: .8; }
  :root[data-theme="light"] .fog i:nth-child(2) { background: #8d9aa5; opacity: .35; }
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: .07; z-index: 50;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }

  .glass {
    background: linear-gradient(140deg, var(--glass-hi), var(--glass) 45%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    backdrop-filter: blur(24px) saturate(150%);
    border: 1px solid var(--edge);
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 24px 60px var(--shadow);
  }

  header { max-width: 1180px; margin: 0 auto; padding: 72px 16px 56px; display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; }
  h1 { font-weight: 300; font-size: clamp(44px, 7vw, 84px); letter-spacing: -.03em; line-height: .95; }
  h1 b { font-weight: 500; }
  .eyebrow, .mono { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .eyebrow { margin-top: 14px; }
  button.toggle { font: inherit; font-size: 14px; color: var(--ink); padding: 12px 22px; border-radius: 999px; cursor: pointer; }
  button.toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  main { max-width: 1180px; margin: 0 auto; padding: 0 16px 96px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
  .card { border-radius: 32px; padding: 28px; display: flex; flex-direction: column; gap: 22px; transition: transform .6s cubic-bezier(.16,1,.3,1); }
  .card:hover { transform: translateY(-4px); }
  .stage { aspect-ratio: 1.25; border-radius: 22px; display: grid; place-items: center; }
  .stage svg { width: 44%; height: auto; }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .lockup svg { width: 34px; height: 34px; flex: none; }
  .word { font-size: 26px; letter-spacing: -.02em; line-height: 1; }
  .word b { font-weight: 600; }
  .word span { font-weight: 300; opacity: .7; }
  .by { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
  .meta h2 { font-size: 20px; font-weight: 500; letter-spacing: -.01em; }
  .meta p { margin-top: 8px; font-size: 15px; line-height: 1.55; color: var(--muted); font-weight: 400; }
  .sizes { display: flex; align-items: end; gap: 14px; padding-top: 18px; border-top: 1px solid var(--edge); }
  .sizes svg { display: block; }
  .sizes .mono { margin-left: auto; white-space: nowrap; letter-spacing: .08em; }
  footer { text-align: center; padding-bottom: 48px; }
  .round-head { max-width: 1180px; margin: 0 auto; padding: 0 16px 20px; }
</style>
</head>

  },
  {
    id: '06·C', title: 'Modelo a capas', tag: 'Base 06',
    text: 'Una cara sólida, otra en vidrio y otra ya laminada. Muestra el recorrido completo, del archivo a la pieza, en un solo objeto.',

      <polygon points="50,20 76,35 50,50 24,35"/><polygon points="24,42 48,55.85 48,81.85 24,68" opacity=".45"/></g>

  {
    id: '18·A', title: 'Calibre F', tag: 'Base 18 + 01',

  {

      <g stroke-width="4.5"><path d="M24 36V24h12"/><path d="M64 24h12v12"/><path d="M76 64v12H64"/><path d="M36 76H24V64"/></g>

  {
    id: '18·C', title: 'Calibre rombo', tag: 'Base 18',

const svg = (inner, size) =>
  `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"${size ? ` width="${size}" height="${size}"` : ''} aria-hidden="true">${inner}</svg>`;

const card = l => `
  <article class="card glass">
    <div class="stage glass">${svg(l.svg)}</div>
    <div class="lockup">${svg(l.svg)}
      <div><div class="word"><b>Filum</b><span>Labs</span></div><span class="by">by NosterLabs</span></div>
    </div>
    <div class="meta">
      <p class="mono">${l.id} · ${l.tag}</p>
      <h2 style="margin-top:6px">${l.title}</h2>
      <p>${l.text}</p>
    </div>
    <div class="sizes">${svg(l.svg, 16)}${svg(l.svg, 24)}${svg(l.svg, 32)}${svg(l.svg, 48)}<span class="mono">16 · 24 · 32 · 48 px</span></div>
  </article>`;
document.getElementById('grid2').innerHTML = round2.map(card).join('');
document.getElementById('grid').innerHTML = logos.map(card).join('');

const btn = document.getElementById('theme');
btn.addEventListener('click', () => {
  const light = document.documentElement.dataset.theme !== 'light';
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  btn.textContent = light ? 'Ver en fondo oscuro' : 'Ver en fondo claro';
});
</script>
</body>
